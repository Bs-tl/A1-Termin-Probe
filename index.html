<style>
/* Layout: one-screen app, header + scrolling form-sheet + bottom tab bar. Cards read like fields on a German Amtsformular. */
:root{
  --paper:#EEF0EA; --sheet:#FFFFFF; --field:#F6F7F2; --ink:#18212B; --muted:#55606B; --faint:#8A929B; --rule:#D6D9CF;
  --accent:#B3132B; --on-accent:#FFFFFF; --accent-soft:#F7E2E5;
  --ok:#22694A; --ok-soft:#DFEEE5; --warn:#8F5300; --warn-soft:#F5E9D5;
  --f-sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101418; --sheet:#191E24; --field:#14181D; --ink:#E8EAE5; --muted:#A1A9B2; --faint:#6F7780; --rule:#2A3138;
  --accent:#F0566B; --on-accent:#1C0A0E; --accent-soft:#3B1A21;
  --ok:#6CC59A; --ok-soft:#173028; --warn:#F0B25C; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101418; --sheet:#191E24; --field:#14181D; --ink:#E8EAE5; --muted:#A1A9B2; --faint:#6F7780; --rule:#2A3138;
  --accent:#F0566B; --on-accent:#1C0A0E; --accent-soft:#3B1A21;
  --ok:#6CC59A; --ok-soft:#173028; --warn:#F0B25C; --warn-soft:#352812; color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-sans);-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.brand{font:600 20px/1 var(--f-cond);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.stamp{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--accent);color:var(--accent);border-radius:50%;font:600 12px/1 var(--f-cond);transform:rotate(-8deg)}
.chip{font:500 13px/1 var(--f-cond);letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--field);color:var(--muted);border:1px solid var(--rule);white-space:nowrap}
.chip.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.sp{margin-left:auto}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 24px}
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);background:var(--sheet)}
.tab{appearance:none;border:0;background:none;color:var(--muted);padding:8px 2px 10px;font:500 13px/1.1 var(--f-cond);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:54px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] span{border-bottom:2px solid var(--accent)}
h2.h{font:600 26px/1.1 var(--f-cond);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.lab{font:500 12px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;gap:8px;align-items:center}
.lab b{color:var(--accent);font-weight:600}
.list{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.row{appearance:none;border:0;background:none;color:inherit;text-align:left;font:inherit;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--rule);cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row .no{font:600 22px/1 var(--f-cond);color:var(--faint);font-variant-numeric:tabular-nums}
.row .t1{font-weight:600;font-size:16px;line-height:1.25}
.row .t2{font:italic 400 14px/1.3 var(--f-serif);color:var(--muted)}
.row .ct{font:500 14px/1 var(--f-cond);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:3px;background:var(--rule);border-radius:2px;margin-top:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.r{background:var(--warn)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.de{font:500 23px/1.3 var(--f-sans);margin:0;text-wrap:pretty}
.de.a{font-size:21px}
.tr{font:italic 400 16px/1.45 var(--f-serif);color:var(--muted);margin:0}
.ans{background:var(--field);border:1px dashed var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.or{display:block;font:500 12px/1.6 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tk{border-bottom:2px solid var(--ok-soft)}
.tk.miss{color:var(--warn);background:var(--warn-soft);border:0;border-radius:4px;padding:0 4px;font-size:.85em}
.w{font:italic 400 .62em var(--f-serif);color:var(--muted);margin-left:4px}
.spell{display:block;font:600 30px/1.1 var(--f-cond);letter-spacing:.12em}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;margin:0}
.play{appearance:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;flex:none}
.play.sm{width:34px;height:34px;background:var(--accent-soft);color:var(--accent)}
.play svg{width:18px;height:18px}
.play.big{width:96px;height:96px}
.play.big svg{width:38px;height:38px}
.play.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){.play.on{animation:none}}
.btn{appearance:none;font:600 15px/1 var(--f-sans);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:13px 14px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.again{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.navr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.pos{text-align:center;font:500 15px/1 var(--f-cond);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.05em}
details.var summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}
details.var summary::before{content:"+ ";color:var(--accent);font-weight:600}
details.var[open] summary::before{content:"– "}
.vline{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px;font-size:16px}
.hint{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.hint p{margin:0;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg .btn{padding:10px 6px;min-height:42px;font-size:14px}
.big-center{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 6px;text-align:center}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--rule)}
.dots i.d{background:var(--ink)}
.dots i.g{background:var(--ok)}
.dots i.h{background:var(--warn)}
.score{font:600 56px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.bub{appearance:none;font:inherit;color:inherit;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:10px 12px;cursor:pointer;width:88%;display:flex;flex-direction:column;gap:4px}
.bub.s{align-self:flex-end;background:var(--field);border-style:dashed}
.bub.cur{border-color:var(--accent);border-style:solid}
.bub .de{font-size:18px}
.bub .tr{font-size:14px}
.who{font:500 12px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.bub.s .who{color:var(--accent)}
.blank{color:var(--faint);font-style:italic}
form.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font:500 12px/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{font:500 16px/1.2 var(--f-sans);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:10px;width:100%;min-width:0;min-height:44px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.set:first-child{border-top:0}
.set input[type=range]{width:46%;accent-color:var(--accent)}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.set select{max-width:55%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--rule);background:var(--field);color:var(--ink)}
.info ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.info a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

</head>

{id:"begr",de:"Begrüßung",tr:"Karşılama ve ilk temas",items:[
["Guten Morgen. Wie geht es Ihnen? | Guten Tag. Wie geht's?","Günaydın. Nasılsınız?","Guten Morgen. Danke, gut. Und Ihnen?","Günaydın. Teşekkürler, iyiyim. Siz nasılsınız?","c"],
["Wie heißen Sie? | Wie ist Ihr Name?","Adınız ne?","Ich heiße {vorname} {nachname}.","Benim adım {vorname} {nachname}.","c"],
["Haben Sie heute einen Termin?","Bugün randevunuz var mı?","Ja, ich habe heute einen Termin.","Evet, bugün randevum var.",""],
["Um wie viel Uhr ist Ihr Termin? | Wann ist Ihr Termin?","Randevunuz saat kaçta?","Um {termin} Uhr.","Saat {termin}.",""],
["Was kann ich für Sie tun? | Warum sind Sie heute hier?","Size nasıl yardımcı olabilirim? / Bugün neden buradasınız?","Ich möchte eine Niederlassungserlaubnis beantragen.","Kalıcı oturum iznine başvurmak istiyorum.","c"],
["Was möchten Sie beantragen?","Neye başvurmak istiyorsunuz?","Eine Niederlassungserlaubnis, bitte.","Kalıcı oturum izni, lütfen.",""],
["Haben Sie Ihren Pass dabei? | Kann ich bitte Ihren Pass sehen?","Pasaportunuz yanınızda mı? / Pasaportunuzu görebilir miyim?","Ja, natürlich. Hier ist mein Pass.","Evet, tabii. İşte pasaportum.","c"],
["Haben Sie die Unterlagen mitgebracht? | Haben Sie alle Unterlagen dabei?","Belgeleri getirdiniz mi?","Ja, hier sind meine Unterlagen.","Evet, belgelerim burada.","c"],
["Sind Sie allein gekommen?","Tek başınıza mı geldiniz?","Ja, ich bin allein gekommen. / Nein, mit meiner Frau.","Evet, tek başıma geldim. / Hayır, eşimle.","s"],
["Bitte setzen Sie sich. | Möchten Sie sich setzen?","Lütfen oturun.","Danke schön.","Çok teşekkürler.",""],
["Verstehen Sie mich gut?","Beni iyi anlıyor musunuz?","Ja, ich verstehe Sie. Bitte sprechen Sie langsam.","Evet, sizi anlıyorum. Lütfen yavaş konuşun.",""],
["Sollen wir Deutsch oder Englisch sprechen? | Können wir Deutsch sprechen?","Almanca mı İngilizce mi konuşalım?","Gern auf Deutsch. Mein Deutsch ist einfach.","Memnuniyetle Almanca. Almancam basit.","c","Almanca'yı seçmek, A1'i yerinde göstermen için fırsat."],
["Sind Sie bereit? | Können wir anfangen?","Hazır mısınız? / Başlayabilir miyiz?","Ja, ich bin bereit.","Evet, hazırım.",""]
]},
{id:"pers",de:"Persönliche Angaben",tr:"Kimlik ve kişisel bilgiler",items:[
["Wie ist Ihr Vorname?","Adınız ne?","Mein Vorname ist {vorname}.","Adım {vorname}.","c"],
["Wie ist Ihr Nachname? | Wie ist Ihr Familienname?","Soyadınız ne?","Mein Nachname ist {nachname}.","Soyadım {nachname}.","c"],
["Können Sie Ihren Namen buchstabieren? | Buchstabieren Sie bitte Ihren Namen.","Adınızı harf harf söyler misiniz?","{spell}","{spelltr}","c","Almanca harf adları: Ö = O-Umlaut, Ü = U-Umlaut, Ş = S mit Häkchen, Ç = C mit Häkchen, Ğ = G mit Bogen, ı = I ohne Punkt."],
["Wann sind Sie geboren? | Was ist Ihr Geburtsdatum?","Ne zaman doğdunuz?","Am {gebdatum}.","{gebdatum}.","c"],
["Wo sind Sie geboren? | Was ist Ihr Geburtsort?","Nerede doğdunuz?","Ich bin in {gebort} geboren.","Doğum yerim {gebort}.","c"],
["Welche Staatsangehörigkeit haben Sie? | Welche Nationalität haben Sie?","Hangi ülkenin vatandaşısınız?","Ich bin Türke. / Ich habe die türkische Staatsangehörigkeit.","Türküm. / Türk vatandaşıyım.",""],
["Wie ist Ihr Familienstand? | Sind Sie verheiratet?","Medeni durumunuz? / Evli misiniz?","Ich bin verheiratet.","Evliyim.","c"],
["Haben Sie einen gültigen Reisepass?","Geçerli pasaportunuz var mı?","Ja, mein Reisepass ist gültig.","Evet, pasaportum geçerli.",""],
["Hatten Sie früher einen anderen Namen? | Haben Sie einen anderen Namen?","Önceden farklı bir adınız var mıydı?","Nein, ich habe keinen anderen Namen.","Hayır, başka adım yok.","s","Formda 'Geburtsname / frühere Namen' alanı var."],
["Wie ist Ihre Telefonnummer?","Telefon numaranız?","Meine Nummer ist null, eins, fünf … [rakam rakam]","Numaram … [rakam rakam söyle]","s","Numara genelde tek tek okunur: null, eins, fünf, sieben …"],
["Wie ist Ihre E-Mail-Adresse? | Wie lautet Ihre E-Mail-Adresse?","E-posta adresiniz?","Meine E-Mail-Adresse ist … [adres]","E-posta adresim …","s","@ = at, Nokta = Punkt, - = Bindestrich, _ = Unterstrich."],
["Wie ist Ihre Adresse? | Wo genau wohnen Sie?","Adresiniz ne?","Ich wohne in der {strasse}, {plz} Hamburg.","{strasse}, {plz} Hamburg adresinde oturuyorum.","c","Sokak adıyla 'in der … straße' denir: Ich wohne in der Musterstraße 12."],
["Sind diese Angaben richtig? | Stimmt das so?","Bu bilgiler doğru mu?","Ja, die Angaben sind richtig.","Evet, bilgiler doğru.",""],
["Hat sich Ihre Adresse geändert? | Sind Sie umgezogen?","Adresiniz değişti mi? / Taşındınız mı?","Nein, meine Adresse ist gleich. / Ja, ich wohne jetzt in …","Hayır, adresim aynı. / Evet, artık … oturuyorum.","s"]
]},
{id:"fam",de:"Herkunft, Familie & Sprachen",tr:"Memleket, aile ve diller",items:[
["Woher kommen Sie? | Aus welchem Land kommen Sie?","Nerelisiniz?","Ich komme aus der Türkei.","Türkiye'den geliyorum.","c"],
["Aus welcher Stadt kommen Sie?","Hangi şehirdensiniz?","Ich komme aus {gebort}.","Memleketim {gebort}.",""],
["Wie heißt Ihre Frau?","Eşinizin adı ne?","Meine Frau heißt {frau}.","Eşimin adı {frau}.","c"],
["Leben Sie mit Ihrer Familie zusammen? | Wohnt Ihre Frau auch in Hamburg?","Ailenizle mi yaşıyorsunuz? / Eşiniz de Hamburg'da mı?","Ja, ich wohne mit meiner Frau zusammen.","Evet, eşimle birlikte yaşıyorum.","c"],
["Seit wann sind Sie verheiratet?","Ne zamandır evlisiniz?","Seit … [yıl].","… [yıl] yılından beri.","s"],
["Was macht Ihre Frau beruflich?","Eşiniz ne iş yapıyor?","Meine Frau arbeitet als … / Meine Frau arbeitet im Moment nicht.","Eşim … olarak çalışıyor. / Eşim şu an çalışmıyor.","s"],
["Haben Sie Kinder?","Çocuğunuz var mı?","{kinder}","{kinder}","c"],
["Wo wohnt Ihre Familie? | Wo wohnen Ihre Eltern?","Aileniz nerede yaşıyor?","Meine Eltern wohnen in der Türkei.","Annemle babam Türkiye'de yaşıyor.","s"],
["Welche Sprachen sprechen Sie?","Hangi dilleri konuşuyorsunuz?","Türkisch, Englisch und ein bisschen Deutsch.","Türkçe, İngilizce ve biraz Almanca.","c"],
["Sprechen Sie Englisch?","İngilizce konuşuyor musunuz?","Ja, ich spreche gut Englisch.","Evet, iyi İngilizce konuşuyorum.",""],
["Wie gut sprechen Sie Deutsch? | Wie ist Ihr Deutsch?","Almancanız ne kadar iyi?","Ich spreche ein bisschen Deutsch. Ich lerne noch.","Biraz Almanca konuşuyorum. Hâlâ öğreniyorum.","c"],
["Wie lernen Sie Deutsch? | Machen Sie einen Deutschkurs?","Almancayı nasıl öğreniyorsunuz? / Kursa gidiyor musunuz?","Ich lerne mit einer App und mit Büchern.","Bir uygulamayla ve kitaplarla öğreniyorum.","cs"],
["Wie oft lernen Sie Deutsch?","Ne sıklıkla Almanca çalışıyorsunuz?","Fast jeden Tag.","Neredeyse her gün.",""],
["Warum lernen Sie Deutsch?","Neden Almanca öğreniyorsunuz?","Ich lebe hier. Ich möchte besser Deutsch sprechen.","Burada yaşıyorum. Daha iyi Almanca konuşmak istiyorum.",""],
["Welche Sprache sprechen Sie zu Hause?","Evde hangi dili konuşuyorsunuz?","Zu Hause sprechen wir Türkisch.","Evde Türkçe konuşuyoruz.",""],
["Sprechen Sie im Alltag Deutsch?","Günlük hayatta Almanca konuşuyor musunuz?","Ja, manchmal. Zum Beispiel beim Einkaufen oder beim Arzt.","Evet, bazen. Örneğin alışverişte ya da doktorda.","c"],
["Haben Sie Freunde in Deutschland?","Almanya'da arkadaşlarınız var mı?","Ja, ich habe Freunde hier.","Evet, burada arkadaşlarım var.",""],
["Was vermissen Sie aus der Türkei?","Türkiye'den neyi özlüyorsunuz?","Meine Familie und das Essen.","Ailemi ve yemekleri.",""],
["Wie oft fahren Sie in die Türkei?","Türkiye'ye ne sıklıkla gidiyorsunuz?","Ein- oder zweimal im Jahr, im Urlaub.","Yılda bir-iki kez, tatilde.","s"]
]},
{id:"wohn",de:"Wohnen & Hamburg",tr:"Ev ve Hamburg",items:[
["In welchem Stadtteil wohnen Sie?","Hangi semtte yaşıyorsunuz?","Ich wohne in {stadtteil}.","{stadtteil} semtinde yaşıyorum.","c"],
["Wohnen Sie in einer Wohnung oder in einem Haus?","Dairede mi müstakil evde mi oturuyorsunuz?","Wir wohnen in einer Wohnung.","Bir dairede oturuyoruz.","s"],
["Wie groß ist Ihre Wohnung?","Daireniz kaç metrekare?","Unsere Wohnung hat {qm} Quadratmeter.","Dairemiz {qm} metrekare.","c","Yeterli oturma alanı başvuru şartlarından biri, bu yüzden gelebilir."],
["Wie viele Zimmer hat Ihre Wohnung?","Dairenizde kaç oda var?","Sie hat {zimmer} Zimmer.","{zimmer} odası var.",""],
["Wohnen Sie allein? | Wer wohnt in Ihrer Wohnung?","Yalnız mı yaşıyorsunuz? / Evde kimler yaşıyor?","Nein, ich wohne mit meiner Frau und unserem Hund.","Hayır, eşim ve köpeğimizle yaşıyorum.","c"],
["Wohnen Sie zur Miete?","Kirada mı oturuyorsunuz?","Nein, wir haben eine eigene Wohnung.","Hayır, kendi dairemiz var.","c"],
["Wohnen Sie gern in Hamburg?","Hamburg'da yaşamayı seviyor musunuz?","Ja, sehr gern.","Evet, çok seviyorum.",""],
["Was gefällt Ihnen an Hamburg?","Hamburg'da neyi seviyorsunuz?","Die Stadt ist schön und grün. Ich mag die Elbe.","Şehir güzel ve yeşil. Elbe'yi seviyorum.","c"],
["Was gefällt Ihnen nicht?","Neyi sevmiyorsunuz?","Das Wetter. Es regnet oft.","Havayı. Sık yağmur yağıyor.",""],
["Wie ist das Wetter heute?","Bugün hava nasıl?","Heute ist es kalt. / Heute ist es warm. / Es regnet.","Bugün hava soğuk. / Bugün hava sıcak. / Yağmur yağıyor.","s"],
["Ist Hamburg teuer?","Hamburg pahalı mı?","Ja, Hamburg ist ziemlich teuer.","Evet, Hamburg epey pahalı.",""],
["Wo kaufen Sie ein?","Alışverişi nereden yapıyorsunuz?","Meistens im Supermarkt.","Genellikle süpermarketten.",""],
["Haben Sie einen Garten?","Bahçeniz var mı?","Ja, wir haben einen Garten.","Evet, bahçemiz var.",""],
["Haben Sie Haustiere?","Evcil hayvanınız var mı?","Ja, wir haben einen Hund.","Evet, bir köpeğimiz var.","c"],
["Wie heißt Ihr Hund?","Köpeğinizin adı ne?","Mein Hund heißt {hund}.","Köpeğimin adı {hund}.",""]
]},
{id:"ne",de:"Blaue Karte & Niederlassung",tr:"Blue Card ve kalıcı oturum",items:[
["Welchen Aufenthaltstitel haben Sie?","Hangi oturum izniniz var?","Ich habe eine Blaue Karte EU.","EU Blue Card'ım var.","c"],
["Seit wann haben Sie die Blaue Karte?","Blue Card'ınız ne zamandan beri var?","Seit November 2023.","Kasım 2023'ten beri.","c","Kartın üzerindeki geçerlilik başlangıcı teslim tarihinden farklı olabilir; kartına bir bak."],
["Warum möchten Sie eine Niederlassungserlaubnis?","Neden kalıcı oturum istiyorsunuz?","Ich lebe und arbeite hier. Ich möchte hierbleiben.","Burada yaşıyor ve çalışıyorum. Burada kalmak istiyorum.","c"],
["Was ist eine Niederlassungserlaubnis?","Kalıcı oturum izni nedir?","Das ist ein unbefristeter Aufenthaltstitel.","Süresiz bir oturum iznidir.",""],
["Wie lange möchten Sie in Deutschland bleiben?","Almanya'da ne kadar kalmak istiyorsunuz?","Lange. Ich möchte hier leben.","Uzun süre. Burada yaşamak istiyorum.",""],
["Wie viele Monate haben Sie mit der Blauen Karte gearbeitet?","Blue Card ile kaç ay çalıştınız?","Mehr als 27 Monate.","27 aydan fazla.","s","Kesin sayıyı emeklilik dökümünden (Versicherungsverlauf) kontrol et."],
["Können Sie einfache Fragen auf Deutsch beantworten?","Basit soruları Almanca cevaplayabilir misiniz?","Ja, ich kann einfache Fragen verstehen und beantworten.","Evet, basit soruları anlayıp cevaplayabilirim.","c"],
["Warum haben Sie keinen Sprachtest gemacht?","Neden dil sınavına girmediniz?","Ich lerne Deutsch. Ich möchte heute mein Deutsch zeigen.","Almanca öğreniyorum. Bugün Almancamı göstermek istiyorum.","c"],
["Können Sie sich bitte kurz vorstellen? | Erzählen Sie bitte etwas über sich.","Kendinizi kısaca tanıtır mısınız?","Ich heiße {vorname}. Ich komme aus der Türkei. Ich bin {alter} Jahre alt. Ich wohne in Hamburg und arbeite im Bankensektor.","Adım {vorname}. Türkiye'den geliyorum. {alter} yaşındayım. Hamburg'da yaşıyor, bankacılıkta çalışıyorum.","c"],
["Bis wann ist Ihre Karte gültig? | Ist Ihre Blaue Karte noch gültig?","Kartınız ne zamana kadar geçerli?","Sie ist bis {gueltig} gültig.","{gueltig} tarihine kadar geçerli.",""],
["Haben Sie den Antrag online gestellt?","Başvuruyu online yaptınız mı?","Ja, ich habe den Antrag online gestellt.","Evet, başvuruyu online yaptım.","","Hamburg'da süreç: önce online başvuru, sonra görüşme daveti."],
["Möchten Sie in Hamburg bleiben?","Hamburg'da kalmak istiyor musunuz?","Ja, ich möchte hier wohnen und arbeiten.","Evet, burada yaşamak ve çalışmak istiyorum.",""],
["Bekommen Sie Sozialleistungen? | Bekommen Sie Bürgergeld?","Sosyal yardım alıyor musunuz?","Nein. Ich arbeite und verdiene mein Geld selbst.","Hayır. Çalışıyorum, paramı kendim kazanıyorum.","cs","Şartlardan biri: geçimini devlet yardımı olmadan sağlamak."],
["Sind Sie vorbestraft? | Hatten Sie Probleme mit der Polizei?","Sabıkanız var mı? / Polisle sorun yaşadınız mı?","Nein.","Hayır.","cs","Şartlardan biri: sabıka kaydı olmaması."],
["Waren Sie länger als sechs Monate im Ausland? | Waren Sie lange in der Türkei?","Altı aydan uzun yurt dışında kaldınız mı?","Nein. Nur im Urlaub, ein paar Wochen.","Hayır. Sadece tatilde, birkaç hafta.","s"],
["Haben Sie ein biometrisches Foto?","Biyometrik fotoğrafınız var mı?","Ja, hier ist es. / Kann ich das Foto hier machen?","Evet, burada. / Fotoğrafı burada çekebilir miyim?","s","Welcome Center'da fotoğraf kabini var (6 €)."],
["Die Gebühr beträgt 113 Euro. | Das kostet 113 Euro.","Harç 113 avro.","In Ordnung. Kann ich mit Karte bezahlen?","Tamam. Kartla ödeyebilir miyim?","c"],
["Die Karte ist in zwei bis vier Wochen fertig.","Kart iki ila dört hafta içinde hazır olur.","Gut. Bekomme ich eine Nachricht?","Güzel. Bana haber gelecek mi?",""]
]},
{id:"arb",de:"Beruf & Arbeit",tr:"İş hayatı ve meslek",items:[
["In welcher Branche arbeiten Sie?","Hangi sektörde çalışıyorsunuz?","Im Bankensektor.","Bankacılık sektöründe.","c"],
["Was machen Sie bei der Arbeit? | Was sind Ihre Aufgaben?","İşte ne yapıyorsunuz?","Ich arbeite an digitalen Produkten und Projekten.","Dijital ürünler ve projeler üzerinde çalışıyorum.","c"],
["Arbeiten Sie im Büro oder zu Hause? | Arbeiten Sie im Homeoffice?","Ofiste mi evden mi çalışıyorsunuz?","Im Büro und manchmal zu Hause.","Ofiste, bazen de evden.","s"],
["Arbeiten Sie Vollzeit?","Tam zamanlı mı çalışıyorsunuz?","Ja, ich arbeite Vollzeit.","Evet, tam zamanlı çalışıyorum.","s"],
["Wie viele Stunden arbeiten Sie pro Woche?","Haftada kaç saat çalışıyorsunuz?","Vierzig Stunden pro Woche.","Haftada kırk saat.","s"],
["Wann beginnt Ihre Arbeit?","İşiniz kaçta başlıyor?","Meistens um neun Uhr.","Genellikle saat dokuzda.","s"],
["Wann haben Sie Feierabend?","Mesainiz kaçta bitiyor?","Meistens um sechs Uhr.","Genellikle saat altıda.","s"],
["Arbeiten Sie im Team?","Bir ekipte mi çalışıyorsunuz?","Ja, ich arbeite in einem Team.","Evet, bir ekipte çalışıyorum.",""],
["Welche Sprache sprechen Sie bei der Arbeit?","İşte hangi dili konuşuyorsunuz?","Meistens Englisch, manchmal Deutsch.","Çoğunlukla İngilizce, bazen Almanca.","c"],
["Haben Sie einen Arbeitsvertrag?","İş sözleşmeniz var mı?","Ja, hier ist mein Arbeitsvertrag.","Evet, işte iş sözleşmem.","c"],
["Arbeiten Sie noch bei Ihrer Firma?","Hâlâ aynı şirkette mi çalışıyorsunuz?","Ja, ich arbeite noch dort.","Evet, hâlâ orada çalışıyorum.","cs","Durumun değiştiyse 'Durum değişirse' bölümündeki cümleleri kullan."],
["Haben Sie den Arbeitgeber gewechselt?","İşveren değiştirdiniz mi?","Nein. / Ja, seit … arbeite ich bei …","Hayır. / Evet, …'den beri …'de çalışıyorum.","s"],
["Wann haben Sie in Deutschland angefangen zu arbeiten?","Almanya'da ne zaman çalışmaya başladınız?","Im Februar 2023.","Şubat 2023'te.","c"],
["Gefällt Ihnen Ihre Arbeit?","İşinizi seviyor musunuz?","Ja, meine Arbeit ist interessant.","Evet, işim ilginç.",""],
["Was haben Sie studiert? | Haben Sie studiert?","Ne okudunuz? / Üniversite okudunuz mu?","Ich habe {fach} studiert.","{fach} okudum.","c","Blue Card yükseköğrenim şartına bağlı; bu soru gelebilir."],
["Wo haben Sie studiert?","Nerede okudunuz?","Ich habe {uniort} studiert.","Okuduğum yer: {uniort}.",""],
["Was haben Sie vorher gemacht? | Wo haben Sie vorher gearbeitet?","Daha önce ne iş yaptınız?","Ich habe auch früher im Bankensektor gearbeitet.","Eskiden de bankacılık sektöründe çalıştım.",""]
]},
{id:"wechsel",de:"Wenn sich etwas ändert",tr:"İş durumun değişirse (Türkçe → Almanca)",items:[
["Hâlâ şirketimde çalışıyorum.","","Ich arbeite noch bei {firma}.","","p"],
["İş sözleşmem devam ediyor.","","Mein Arbeitsvertrag läuft noch.","","p"],
["İşveren değiştiriyorum.","","Ich wechsle meinen Arbeitgeber.","","p"],
["… tarihinde yeni şirkette başlıyorum.","","Ich fange am … bei … an.","","p"],
["İşte yeni iş sözleşmem.","","Hier ist mein neuer Arbeitsvertrag.","","p"],
["Şu anda yeni bir iş arıyorum.","","Ich suche gerade eine neue Stelle.","","p"],
["Almanya'da çalışmaya devam etmek istiyorum.","","Ich möchte weiter in Deutschland arbeiten.","","p"]
]},
{id:"doc",de:"Unterlagen & Versicherung",tr:"Evrak, maaş ve sigorta",items:[
["Haben Sie Ihre Gehaltsabrechnungen dabei?","Maaş bordrolarınız yanınızda mı?","Ja, hier sind meine Gehaltsabrechnungen.","Evet, bordrolarım burada.","c"],
["Können Sie mir die letzten drei Abrechnungen geben?","Son üç bordroyu verir misiniz?","Ja, einen Moment, bitte.","Evet, bir dakika lütfen.",""],
["Wie viel verdienen Sie? | Wie hoch ist Ihr Gehalt?","Ne kadar kazanıyorsunuz?","Ich verdiene … Euro brutto im Jahr.","Yıllık brüt … avro kazanıyorum.","s","Sayıyı Almanca söylemeyi çalış: 60.000 = sechzigtausend."],
["Haben Sie einen Versicherungsverlauf? | Haben Sie einen Rentenversicherungsverlauf?","Emeklilik sigortası dökümünüz var mı?","Ja, hier ist mein Versicherungsverlauf.","Evet, işte emeklilik dökümüm.","c"],
["Zahlen Sie in die Rentenversicherung ein?","Emeklilik primi ödüyor musunuz?","Ja, über meine Arbeit.","Evet, işim üzerinden.",""],
["Wo sind Sie krankenversichert? | Sind Sie krankenversichert?","Hangi sağlık sigortasındasınız?","Ich bin bei {kasse} versichert.","{kasse} sigortalısıyım.","c"],
["Haben Sie einen Nachweis von der Krankenkasse?","Sigortadan belgeniz var mı?","Ja, hier ist die Bescheinigung.","Evet, işte belge.",""],
["Haben Sie einen Mietvertrag oder einen Kaufvertrag?","Kira ya da satış sözleşmeniz var mı?","Hier ist unser Kaufvertrag.","İşte satın alma sözleşmemiz.","c","Oturma alanını (m²) gösteren belge isteniyor."],
["Haben Sie das Original dabei?","Aslı yanınızda mı?","Ja, das Original ist hier.","Evet, aslı burada.",""],
["Haben Sie auch eine Kopie?","Fotokopisi var mı?","Ja, hier ist eine Kopie. / Nein, leider nicht.","Evet, işte fotokopi. / Maalesef yok.","s"],
["Es fehlt noch ein Dokument. | Fehlt noch etwas?","Bir belge eksik.","Welche Unterlage fehlt, bitte?","Hangi belge eksik, lütfen?","c"],
["Können Sie das Dokument nachreichen?","Belgeyi sonradan getirebilir misiniz?","Ja. Bis wann?","Evet. Ne zamana kadar?","c"],
["Laden Sie das bitte online hoch. | Können Sie das per E-Mail schicken?","Lütfen online yükleyin. / E-postayla gönderebilir misiniz?","Ja, das mache ich heute noch.","Evet, bugün hallederim.",""],
["Ist Ihre Adresse aktuell?","Adresiniz güncel mi?","Ja, meine Adresse ist aktuell.","Evet, adresim güncel.",""],
["Wie möchten Sie bezahlen? | Bar oder mit Karte?","Nasıl ödemek istersiniz?","Mit Karte, bitte.","Kartla, lütfen.",""],
["Brauchen Sie eine Quittung?","Makbuz ister misiniz?","Ja, bitte.","Evet, lütfen.",""]
]},
{id:"alltag",de:"Alltag",tr:"Günlük rutin",items:[
["Wann stehen Sie auf?","Ne zaman kalkarsınız?","Meistens um acht Uhr.","Genellikle saat sekizde.","s"],

/* ---------- Almanca sayı/tarih yardımcıları ---------- */
var MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
var MON_TR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var WD_TR=["pazar","pazartesi","salı","çarşamba","perşembe","cuma","cumartesi"];
var ONES=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
var TENS=["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function n2w(n){if(n<20)return ONES[n];var t=Math.floor(n/10),u=n%10;return (u?(u===1?"ein":ONES[u])+"und":"")+TENS[t];}
function ordw(n){var irr={1:"erste",3:"dritte",7:"siebte",8:"achte"};if(irr[n])return irr[n];return n<20?n2w(n)+"te":n2w(n)+"ste";}
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?{y:+m[1],m:+m[2],d:+m[3]}:null;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var LET={A:["A","Ah"],B:["Be","Beh"],C:["Ce","Zeh"],D:["De","Deh"],E:["E","Eh"],F:["Eff","Eff"],G:["Ge","Geh"],H:["Ha","Hah"],I:["I","Ih"],J:["Jott","Jott"],K:["Ka","Kah"],L:["Ell","Ell"],M:["Emm","Emm"],N:["Enn","Enn"],O:["O","Oh"],P:["Pe","Peh"],Q:["Ku","Kuh"],R:["Err","Err"],S:["Ess","Ess"],T:["Te","Teh"],U:["U","Uh"],V:["Vau","Fau"],W:["We","Weh"],X:["Ix","Iks"],Y:["Ypsilon","Üpsilon"],Z:["Zett","Zett"],"Ä":["A-Umlaut","A Umlaut"],"Ö":["O-Umlaut","O Umlaut"],"Ü":["U-Umlaut","U Umlaut"],"ß":["Eszett","Ess Zett"],"Ç":["C mit Häkchen","Zeh mit Häkchen"],"Ş":["S mit Häkchen","Ess mit Häkchen"],"Ğ":["G mit Bogen","Geh mit Bogen"],"-":["Bindestrich","Bindestrich"]};
function spellWord(w){var out=[];for(var i=0;i<w.length;i++){var c=w[i];if(c===" ")continue;var up,key;if(c==="ı"){out.push({c:"I",n:"I ohne Punkt",s:"Ih ohne Punkt"});continue;}if(c==="i"||c==="İ"){key="I";up="I";}else{up=c.toUpperCase();key=up;}var L=LET[key]||[up,up];out.push({c:up==="I"&&c==="İ"?"İ":up,n:L[0],s:L[1]});}return out;}

/* ---------- Token çözümleyici ---------- */
function tokens(){
  var f=S.f,T={},now=new Date();
  function put(k,d,s,tr){T[k]={d:d,s:s==null?String(d).replace(/<[^>]+>/g,""):s,tr:tr==null?d:tr};}
  FIELDS.forEach(function(def){var v=(f[def.k]||"").trim();if(!v)return;
    if(def.opts){var o=def.opts.filter(function(x){return x[0]===v;})[0];if(o)put(def.k,esc(v),v,esc(o[1]));}
    else put(def.k,esc(v),v);});
  var g=pd(f.gebdatum);
  if(g){var a=now.getFullYear()-g.y-((now.getMonth()+1<g.m||(now.getMonth()+1===g.m&&now.getDate()<g.d))?1:0);
    put("alter",a+'<span class="w">'+n2w(a)+"</span>",String(a),String(a));
    put("gebdatum",g.d+". "+MON[g.m-1]+" "+g.y,null,g.d+" "+MON_TR[g.m-1]+" "+g.y);
    put("geburtstag",g.d+". "+MON[g.m-1],null,g.d+" "+MON_TR[g.m-1]);}
  var mo=(now.getFullYear()-2023)*12+(now.getMonth()+1-2);
  put("monate",mo+'<span class="w">'+(mo<100?n2w(mo):"")+"</span>",String(mo),String(mo));
  put("wochentag",WD[now.getDay()],null,WD_TR[now.getDay()]);
  var dd=now.getDate();
  put("datum",dd+'. <span class="w">'+ordw(dd)+"</span> "+MON[now.getMonth()],ordw(dd)+" "+MON[now.getMonth()],dd+" "+MON_TR[now.getMonth()]);
  put("monat",MON[now.getMonth()],null,MON_TR[now.getMonth()]);
  put("jahr",String(now.getFullYear()));
  var hh=now.getHours(),mm=now.getMinutes(),hm=hh+":"+(mm<10?"0":"")+mm;
  put("uhr",hm+" Uhr",hh+" Uhr "+(mm?mm:""),hm);
  var cm=parseInt(f.groesse,10);
  if(cm>100&&cm<230){var m2=(cm/100).toFixed(2).replace(".",",");put("groesse",m2+" m",cm<200?"einen Meter "+n2w(cm-100):"zwei Meter "+n2w(cm-200),m2+" m");}
  if(T.anreise){var ar=f.anreise;put("anreisek",esc(ar.charAt(0).toUpperCase()+ar.slice(1)),ar.charAt(0).toUpperCase()+ar.slice(1),T.anreise.tr);}
  var kg=pd(f.kartegueltig);
  if(kg)put("gueltig",kg.d+". "+MON[kg.m-1]+" "+kg.y,null,kg.d+" "+MON_TR[kg.m-1]+" "+kg.y);
  if(T.termin)T.termin.tr=T.termin.d;
  var names=[f.vorname,f.nachname].map(function(x){return (x||"").trim();}).filter(Boolean);
  if(names.length){var dh=[],ss=[],tt=[];
    names.forEach(function(nm){var sp=spellWord(nm);
      dh.push('<span class="spell">'+esc(sp.map(function(x){return x.c;}).join("·"))+"</span>"+esc(sp.map(function(x){return x.n;}).join(", ")));
      ss.push(sp.map(function(x){return x.s;}).join(", "));tt.push(sp.map(function(x){return x.c;}).join("-"));});
    put("spell",dh.join("<br>"),ss.join(". "),esc(tt.join(" – ")));put("spelltr",esc(tt.join(" – ")));}
  return T;
}
var MISS={alter:"yaş",monate:"ay",groesse:"boy",gueltig:"bitiş tarihi",anreisek:"ulaşım",spell:"ad",spelltr:"ad",gebdatum:"doğum tarihi",geburtstag:"doğum günü"};
function fieldOf(k){return FIELDS.filter(function(x){return x.k===k;})[0];}
/* mode: d = Almanca ekran, t = Türkçe ekran, s = konuşma */
function fill(str,mode,T){
  T=T||tokens();
  return String(str).split(/(\{\w+\})/).map(function(part){
    var m=/^\{(\w+)\}$/.exec(part);
    if(!m)return mode==="s"?part:esc(part);
    var k=m[1],t=T[k];
    if(t){if(mode==="s")return t.s;return '<span class="tk">'+(mode==="t"?t.tr:t.d)+"</span>";}
    var fd=fieldOf(k);
    if(mode==="s")return fd&&fd.sp?fd.sp:"";
    return '<span class="tk miss">['+esc(fd?fd.l:(MISS[k]||k))+"]</span>";
  }).join("");
}
function speechText(str,T){var s=fill(str,"s",T).split(" / ")[0];return s.replace(/\[[^\]]*\]/g,"").replace(/\([^)]*\)/g,"").replace(/…/g,"").replace(/\s+/g," ").trim();}
function showAlt(html){return html.split(" / ").join('<span class="or">ya da</span>');}
function qv(it){return it[0].split("|").map(function(x){return x.trim();});}
function isP(it){return (it[4]||"").indexOf("p")>-1;}
function key(si,i){return SECS[si].id+":"+i;}

/* ---------- Ses (Web Speech API) ---------- */
var TTS={de:null,tr:null,list:[]};
var curRun=0,unlocked=false;
function pickVoices(){
  if(!("speechSynthesis" in window))return;
  var v=speechSynthesis.getVoices()||[];TTS.list=v;
  function best(re,saved,prefer){var c=v.filter(function(x){return re.test(x.lang);});if(!c.length)return null;c.sort(function(a,b){return (/(DE|TR)$/i.test(b.lang)?1:0)-(/(DE|TR)$/i.test(a.lang)?1:0);});
    var s=c.filter(function(x){return x.name===saved;})[0];if(s)return s;
    for(var i=0;i<prefer.length;i++){var p=c.filter(function(x){return prefer[i].test(x.name);})[0];if(p)return p;}
    return c.filter(function(x){return x.localService;})[0]||c[0];}
  TTS.de=best(/^de([-_]DE)?/i,S.deV,[/premium|enhanced|erweitert/i,/Anna/,/Google Deutsch/,/Helena|Petra|Markus|Katja|Conrad/]);
  TTS.tr=best(/^tr/i,S.trV,[/premium|enhanced/i,/Yelda/,/Google/]);
}
if("speechSynthesis" in window){pickVoices();speechSynthesis.onvoiceschanged=function(){pickVoices();if(st.tab==="me")render();};}
function unlock(){if(unlocked||!("speechSynthesis" in window))return;unlocked=true;try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}}
function say(text,lang,opt){
  opt=opt||{};
  return new Promise(function(res){
    if(!text||!("speechSynthesis" in window)){if(!("speechSynthesis" in window))toast("Bu tarayıcıda seslendirme yok.");res();return;}
    var u=new SpeechSynthesisUtterance(text),tr=lang==="tr",v=tr?TTS.tr:TTS.de;
    if(v)u.voice=v;u.lang=tr?"tr-TR":"de-DE";u.rate=opt.rate||(tr?1:S.rate);u.pitch=opt.pitch||1;
    var done=false,t;function fin(){if(done)return;done=true;clearTimeout(t);res();}
    u.onend=fin;u.onerror=fin;t=setTimeout(fin,3000+text.length*130/u.rate);
    TTS.keep=u;speechSynthesis.speak(u);
  });
}
function stopSpeech(){curRun++;st.auto=false;try{speechSynthesis.cancel();}catch(e){}}
function sleep(ms,run){return new Promise(function(r){var t0=Date.now();var iv=setInterval(function(){if(run!==curRun||Date.now()-t0>=ms){clearInterval(iv);r();}},100);});}
function playOne(text,lang,opt){stopSpeech();var run=curRun;setPlaying(true);
  setTimeout(function(){say(text,lang,opt).then(function(){if(run===curRun)setPlaying(false);});},60);}
function setPlaying(on){document.querySelectorAll(".play[data-live]").forEach(function(b){b.classList.toggle("on",on);});}

  h+='<h2 class="h">Sonuç</h2><div class="card"><div class="hrow"><span class="score">'+ok+"/"+iv.res.length+'</span><span class="sub" style="margin:0">anladın.<br>Zorlandıkların tekrar listesine eklendi.</span></div>';
  var bad=iv.list.slice(0,iv.res.length).filter(function(_,j){return !iv.res[j];});
  if(bad.length){h+='<div class="lab" lang="de">Zorlandıkların</div>';bad.forEach(function(c){var it=SECS[c[0]].items[c[1]];h+='<div class="vline"><button class="play sm" data-a="sayText" data-v="'+esc(qv(it)[c[2]])+'" aria-label="Dinle">'+ICON.play+"</button><span>"+esc(qv(it)[c[2]])+"</span></div>";});}
  h+='</div><div class="grid2" style="margin-top:12px"><button class="btn" data-a="ivSetup">Ayarlar</button><button class="btn pri" data-a="ivStart">Yeni tur</button></div>';
  return h;
}
function vScenes(){
  var T=tokens(),h="";
  if(st.sc===null){
    h+='<h2 class="h">Görüşme senaryoları</h2><p class="sub">Memur konuşur, sıra sende gelince durur. Söyle, sonra devam et.</p><div class="list">';
    SCENES.forEach(function(s,j){h+='<button class="row" data-a="scOpen" data-v="'+j+'"><span class="no">S'+(j+1)+'</span><span style="min-width:0"><span class="t1">'+esc(s.t)+'</span><br><span class="t2">'+esc(fill(s.l[0][1],"s",T))+'</span></span><span class="ct">'+s.l.length+" satır</span></button>";});
    return h+"</div>";
  }
  var sc=SCENES[st.sc],running=st.scCur>-1;
  h+='<div class="hrow" style="margin-bottom:10px"><button class="btn ghost" data-a="scBack" aria-label="Senaryolara dön" style="padding:10px 6px">'+ICON.left+'</button><div style="flex:1;min-width:0"><div class="lab" lang="de">S'+(st.sc+1)+'</div><div class="t1" style="font-weight:600">'+esc(sc.t)+'</div></div><button class="btn '+(running?"":"pri")+'" data-a="scPlay">'+(running?ICON.stop+"Durdur":ICON.play+"Oynat")+"</button></div>";
  h+='<div class="set" style="border:0;padding-top:0"><label for="scHide">Benim repliklerimi gizle</label><input type="checkbox" id="scHide" data-a="scHide"'+(S.scHide?" checked":"")+"></div>";
  h+='<div class="stack">';
  sc.l.forEach(function(ln,j){var me=ln[0]==="s",hid=me&&S.scHide&&!st.scRev[j];
    h+='<button class="bub '+(me?"s":"")+(st.scCur===j?" cur":"")+'" data-a="scLine" data-v="'+j+'"><span class="who">'+(me?"Sen":"Memur")+"</span>"+(hid?'<span class="blank">'+(st.scCur===j?"Sıra sende. Söyle, sonra Devam'a bas.":"Dokun: kendi cevabını gör")+"</span>":'<span class="de">'+fill(ln[1],"d",T)+'</span><span class="tr">'+fill(ln[2],"t",T)+"</span>")+"</button>";});
  h+="</div>";
  if(st.scWait)h+='<button class="btn pri wide" data-a="scGo" style="margin-top:12px">Devam</button>';
  return h;
}
function vMe(){
  var f=S.f,h='<h2 class="h">Bilgilerim</h2><p class="sub">Cevaplardaki boşluklar buradan dolar. Sadece bu cihazda saklanır.</p><form class="fields card" onsubmit="return false">';
  FIELDS.forEach(function(d){var full=d.opts||d.k==="anreise";h+='<div class="fld'+(d.opts?" full":"")+'"><label for="f_'+d.k+'">'+esc(d.l)+"</label>";
    if(d.opts){h+='<select id="f_'+d.k+'" data-f="'+d.k+'">'+d.opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(f[d.k]===o[0]?" selected":"")+">"+esc(o[0]?o[0]+" · "+o[1]:o[1])+"</option>";}).join("")+"</select>";}
    else h+='<input id="f_'+d.k+'" data-f="'+d.k+'" type="'+(d.type==="number"?"text":(d.type||"text"))+'"'+(d.type==="number"||d.type==="tel"?' inputmode="numeric"':"")+' value="'+esc(f[d.k]||"")+'" placeholder="'+esc(d.ph||"")+'" autocomplete="off">';
    h+="</div>";});
  h+="</form>";
  var dv=TTS.list.filter(function(v){return /^de/i.test(v.lang);}),tv=TTS.list.filter(function(v){return /^tr/i.test(v.lang);});
  h+='<h2 class="h" style="margin-top:20px">Ses</h2><div class="card" style="gap:0">';
  h+='<div class="set"><label for="rate">Konuşma hızı <span class="pos">'+S.rate.toFixed(2).replace(".",",")+'×</span></label><input id="rate" type="range" min="0.6" max="1.15" step="0.05" value="'+S.rate+'" data-s="rate"></div>';
  h+='<div class="set"><label for="pause">Otomatikte düşünme süresi <span class="pos">'+S.pause+' sn</span></label><input id="pause" type="range" min="2" max="10" step="1" value="'+S.pause+'" data-s="pause"></div>';
  h+='<div class="set"><label for="readTr">Otomatikte Türkçesini de oku</label><input id="readTr" type="checkbox" data-s="readTr"'+(S.readTr?" checked":"")+"></div>";
  h+='<div class="set"><label for="hideQ">Kartlarda önce sadece dinle</label><input id="hideQ" type="checkbox" data-s="hideQ"'+(S.hideQ?" checked":"")+"></div>";
  h+='<div class="set"><label for="deV">Almanca ses</label><select id="deV" data-s="deV">'+(dv.length?dv.map(function(v){return '<option'+(TTS.de&&TTS.de.name===v.name?" selected":"")+">"+esc(v.name)+"</option>";}).join(""):"<option>Bulunamadı</option>")+"</select></div>";
  h+='<div class="set"><label for="trV">Türkçe ses</label><select id="trV" data-s="trV">'+(tv.length?tv.map(function(v){return '<option'+(TTS.tr&&TTS.tr.name===v.name?" selected":"")+">"+esc(v.name)+"</option>";}).join(""):"<option>Bulunamadı</option>")+"</select></div>";
  h+='<div class="set"><span>Sesi dene</span><button class="btn" data-a="sayText" data-v="Guten Tag. Ich möchte eine Niederlassungserlaubnis beantragen.">'+ICON.spk+"Dinle</button></div></div>";
  h+='<p class="sub" style="margin-top:8px">iPhone\'da daha doğal ses için: Ayarlar › Erişilebilirlik › Seslendirilen İçerik › Sesler › Almanca\'dan "Anna (Gelişmiş)" indir.</p>';
  h+='<h2 class="h" style="margin-top:20px">Görüşme hakkında</h2><div class="card info"><ul>'+
   "<li>27 ay Blue Card + A1 yolunda <b>Leben-in-Deutschland belgesi istenmiyor</b>; o yalnızca 21 ay + B1 yolunda.</li>"+
   "<li>Kural sertifika. Görüşmede A1 açıkça görülürse sertifikadan vazgeçilebilir; bu memurun kararı, garanti değil.</li>"+
   "<li>Süreç: online başvuru → görüşme daveti → belgelerin asılları → parmak izi, imza, fotoğraf → kart 2–4 haftada.</li>"+
   "<li>Harç 113 €, yerinde biyometrik fotoğraf 6 €.</li>"+
   "<li>Şartlarda ayrıca: yeterli oturma alanı, sabıka kaydı olmaması, yardımsız geçim, sağlık sigortası. Bu yüzden m², sabıka ve sosyal yardım soruları eklendi.</li>"+
   "<li>Hamburg Welcome Center · Süderstraße 32b, 20097 Hamburg</li>"+
   '</ul><a href="https://www.hamburg.com/publicservice/info/111204806/">Resmî sayfa: Blue Card ile kalıcı oturum</a></div>';
  h+='<div style="margin-top:16px">'+(st.resetAsk?'<div class="grid2"><button class="btn" data-a="resetNo">Vazgeç</button><button class="btn again" data-a="resetYes">Evet, sıfırla</button></div>':'<button class="btn ghost wide" data-a="resetAsk">İlerlemeyi sıfırla</button>')+"</div>";
  return h;
}
function header(){
  var c=document.getElementById("tchip"),d=pd(S.f.termindatum);
  if(d){var now=new Date();now.setHours(0,0,0,0);var t=new Date(d.y,d.m-1,d.d);var n=Math.round((t-now)/864e5);
    c.className="chip hot";c.style.textTransform="none";c.textContent=n>0?"Termin · "+n+" gün":n===0?"Termin bugün":"Termin geçti";}
  else{c.className="chip";c.textContent="§ 18c AufenthG";}
}
function render(){
  var v=document.getElementById("view"),h;
  if(st.tab==="study")h=st.sec===null?vStudyList():vCard();
  else if(st.tab==="iv")h=vInterview();
  else if(st.tab==="sc")h=vScenes();
  else h=vMe();
  v.innerHTML=h;header();
  document.querySelectorAll(".tab").forEach(function(b){if(b.dataset.v===st.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
}
function toTop(){document.getElementById("view").scrollTop=0;}

/* ---------- Otomatik dinleme ---------- */
function autoRun(){
  stopSpeech();var run=curRun;st.auto=true;st.rev=false;render();
  (async function(){
    var L=curList();
    while(run===curRun&&st.idx<L.length){
      var it=SECS[L[st.idx][0]].items[L[st.idx][1]],T=tokens();
      st.rev=false;st.showQ=true;render();
      if(isP(it))await say(speechText(it[0],T),"tr");else await say(speechText(qv(it)[0],T),"de");
      if(run!==curRun)return;await sleep(S.pause*1000,run);if(run!==curRun)return;
      st.rev=true;render();await say(speechText(it[2],T),"de");
      if(run!==curRun)return;
      if(S.readTr&&!isP(it)&&it[3]){await sleep(400,run);if(run!==curRun)return;await say(speechText(it[3],T),"tr");}
      await sleep(1400,run);if(run!==curRun)return;
      if(st.idx<L.length-1){st.idx++;toTop();}else break;
    }
    if(run===curRun){st.auto=false;render();}
  })();
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){});}catch(e){}
}

/* ---------- Mülakat ---------- */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ivSayQ(rate){var iv=st.iv,c=iv.list[iv.k],it=SECS[c[0]].items[c[1]];playOne(speechText(qv(it)[c[2]]),"de",rate?{rate:rate}:null);}

/* ---------- Senaryo oynatma ---------- */
function scRun(){
  stopSpeech();var run=curRun,sc=SCENES[st.sc];st.scRev={};
  (async function(){
    for(var j=0;j<sc.l.length;j++){
      if(run!==curRun)return;var ln=sc.l[j];st.scCur=j;
      if(ln[0]==="s"&&S.scHide){await new Promise(function(r){st.scWait=r;render();});if(run!==curRun)return;st.scWait=null;st.scRev[j]=true;render();await say(speechText(ln[1]),"de",{pitch:1.15});}
      else{st.scRev[j]=true;render();await say(speechText(ln[1]),"de",ln[0]==="s"?{pitch:1.15}:null);}
      await sleep(500,run);
    }
    if(run===curRun){st.scCur=-1;render();}
  })();
}
function scStop(){stopSpeech();if(st.scWait){var r=st.scWait;st.scWait=null;r();}st.scCur=-1;}

/* ---------- Olaylar ---------- */
var A={
 tab:function(d){stopSpeech();scStop();st.tab=d.v;st.resetAsk=false;render();toTop();},
 open:function(d){st.sec=+d.v;st.idx=0;st.rev=false;st.showQ=false;render();toTop();},
 openAgain:function(){st.sec="again";st.idx=0;st.rev=false;st.showQ=false;render();toTop();},
 back:function(){stopSpeech();st.sec=null;render();toTop();},
 reveal:function(){st.rev=true;render();var L=curList(),it=SECS[L[st.idx][0]].items[L[st.idx][1]];playOne(speechText(it[2]),"de");},
 showQ:function(){st.showQ=true;render();},
 sayq:function(d){var L=curList(),it=SECS[L[st.idx][0]].items[L[st.idx][1]];playOne(speechText(qv(it)[+d.v||0]),"de");},
 saya:function(){var L=curList(),it=SECS[L[st.idx][0]].items[L[st.idx][1]];playOne(speechText(it[2]),"de");},
 sayp:function(){var L=curList(),it=SECS[L[st.idx][0]].items[L[st.idx][1]];playOne(speechText(it[0]),"tr");},
 sayText:function(d){playOne(d.v,"de");},
 mark:function(d){var L=curList(),k=key(L[st.idx][0],L[st.idx][1]),v=+d.v;stopSpeech();
   if(S.p[k]===v)delete S.p[k];else S.p[k]=v;save();
   var again=st.sec==="again";var nl=curList();
   if(again){if(st.idx>=nl.length)st.idx=Math.max(0,nl.length-1);}else if(st.idx<nl.length-1)st.idx++;
   st.rev=false;st.showQ=false;render();toTop();},
 prev:function(){stopSpeech();if(st.idx>0)st.idx--;st.rev=false;st.showQ=false;render();toTop();},
 next:function(){stopSpeech();var L=curList();if(st.idx<L.length-1)st.idx++;st.rev=false;st.showQ=false;render();toTop();},
 auto:function(){if(st.auto){stopSpeech();render();}else autoRun();},
 ivN:function(d){S.ivN=+d.v;save();render();},
 ivPool:function(d){S.ivPool=d.v;save();render();},
 ivStart:function(){var P=ivPool();if(!P.length){toast("Bu havuzda soru yok.");return;}
   var list=shuffle(P.slice()).slice(0,S.ivN).map(function(c){var n=qv(SECS[c[0]].items[c[1]]).length;return [c[0],c[1],Math.floor(Math.random()*n)];});
   st.iv={ph:"run",list:list,k:0,res:[],shown:false,txt:false};render();toTop();ivSayQ();},
 ivSay:function(){ivSayQ();},
 ivSlow:function(){ivSayQ(0.65);},
 ivTxt:function(){st.iv.txt=true;render();},
 ivShow:function(){st.iv.shown=true;render();var c=st.iv.list[st.iv.k];playOne(speechText(SECS[c[0]].items[c[1]][2]),"de");},
 ivSayA:function(){var c=st.iv.list[st.iv.k];playOne(speechText(SECS[c[0]].items[c[1]][2]),"de");},
 ivRes:function(d){var iv=st.iv,c=iv.list[iv.k],k=key(c[0],c[1]);iv.res.push(d.v==="1");S.p[k]=d.v==="1"?2:1;save();
   iv.k++;iv.shown=false;iv.txt=false;if(iv.k>=iv.list.length){iv.ph="done";stopSpeech();render();toTop();}else{render();toTop();ivSayQ();}},
 ivQuit:function(){stopSpeech();st.iv.ph=st.iv.res.length?"done":"setup";render();toTop();},
 ivSetup:function(){st.iv={ph:"setup"};render();},
 scOpen:function(d){st.sc=+d.v;st.scRev={};st.scCur=-1;render();toTop();},
 scBack:function(){scStop();st.sc=null;render();toTop();},
 scPlay:function(){if(st.scCur>-1){scStop();render();}else scRun();},
 scGo:function(){if(st.scWait){var r=st.scWait;st.scWait=null;r();}},
 scLine:function(d){var j=+d.v,ln=SCENES[st.sc].l[j];if(st.scWait&&st.scCur===j){A.scGo();return;}if(st.scCur>-1)return;st.scRev[j]=true;render();playOne(speechText(ln[1]),"de",ln[0]==="s"?{pitch:1.15}:null);},
 resetAsk:function(){st.resetAsk=true;render();},
 resetNo:function(){st.resetAsk=false;render();},
 resetYes:function(){S.p={};save();st.resetAsk=false;render();toast("İlerleme sıfırlandı");}
};
document.addEventListener("click",function(e){unlock();var b=e.target.closest("[data-a]");if(!b||b.tagName==="INPUT")return;if(b.getAttribute("aria-disabled")==="true")return;var f=A[b.dataset.a];if(f){e.preventDefault();f(b.dataset,b);}});
document.addEventListener("input",function(e){var t=e.target;
  if(t.dataset.f){S.f[t.dataset.f]=t.value;save();header();}
  else if(t.dataset.s==="rate"||t.dataset.s==="pause"){S[t.dataset.s]=parseFloat(t.value);save();var lab=t.parentNode.querySelector(".pos");if(lab)lab.textContent=t.dataset.s==="rate"?S.rate.toFixed(2).replace(".",",")+"×":S.pause+" sn";}});
document.addEventListener("change",function(e){var t=e.target;
  if(t.dataset.f){S.f[t.dataset.f]=t.value;save();header();}
  else if(t.dataset.s==="readTr"||t.dataset.s==="hideQ"){S[t.dataset.s]=t.checked;save();}
  else if(t.dataset.s==="deV"||t.dataset.s==="trV"){S[t.dataset.s]=t.value;save();pickVoices();}
  else if(t.dataset.a==="scHide"){S.scHide=t.checked;save();render();}});
document.addEventListener("visibilitychange",function(){if(document.hidden){stopSpeech();scStop();}});
render();
</script>
